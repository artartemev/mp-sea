# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:15
    container_name: marketplace_db
    restart: always
    environment:
      - POSTGRES_USER=market_user
      - POSTGRES_PASSWORD=market_password
      - POSTGRES_DB=marketplace
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data: